# =============================================================================
# TEMPLATE 1: Foundation Layer — S3, IAM Roles, KMS, SSM Parameters
# Stack Name: ad-scorer-foundation
# Deploy FIRST — all other stacks depend on outputs from this stack.
# =============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Foundation stack for the Predictive Ad Creative Performance Scorer.
  Provisions S3 buckets, KMS encryption key, and least-privilege IAM roles.

# ─── Parameters ───────────────────────────────────────────────────────────────
Parameters:
  ProjectName:
    Type: String
    Default: ad-scorer
    Description: Short project identifier used as a prefix for all resource names.
    AllowedPattern: "^[a-z0-9-]{3,20}$"

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment.

  RetentionDays:
    Type: Number
    Default: 90
    Description: Days to retain raw creative assets in S3 before transitioning to Glacier.

# ─── Resources ────────────────────────────────────────────────────────────────
Resources:

  # ── KMS Key for all encryption at rest ──────────────────────────────────────
  ScorerKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encryption key for ${ProjectName} assets and data"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowServicePrincipals
            Effect: Allow
            Principal:
              Service:
                - s3.amazonaws.com
                - lambda.amazonaws.com
                - sagemaker.amazonaws.com
                - states.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ScorerKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-key"
      TargetKeyId: !Ref ScorerKMSKey

  # ── S3 Bucket: Raw creative asset ingestion ──────────────────────────────────
  CreativeAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-creative-assets-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ScorerKMSKey
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacier
            Status: Enabled
            Transitions:
              - TransitionInDays: !Ref RetentionDays
                StorageClass: GLACIER
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CreativeAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CreativeAssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLSRequests
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CreativeAssetsBucket.Arn
              - !Sub "${CreativeAssetsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ── S3 Bucket: SageMaker training data and model artifacts ──────────────────
  MLArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-ml-artifacts-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ScorerKMSKey
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  MLArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MLArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLSRequests
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt MLArtifactsBucket.Arn
              - !Sub "${MLArtifactsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ── IAM Role: Lambda — Feature Extraction ────────────────────────────────────
  LambdaFeatureExtractionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-feature-extraction-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FeatureExtractionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read creative assets from S3
              - Sid: S3ReadCreatives
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub "${CreativeAssetsBucket.Arn}/*"
              # Write extracted features back to S3
              - Sid: S3WriteFeatures
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${MLArtifactsBucket.Arn}/features/*"
              # Rekognition — computer vision (image analysis only)
              - Sid: RekognitionImageAnalysis
                Effect: Allow
                Action:
                  - rekognition:DetectLabels
                  - rekognition:DetectFaces
                  - rekognition:DetectText
                  - rekognition:DetectModerationLabels
                  - rekognition:RecognizeCelebrities
                  - rekognition:DetectProtectiveEquipment
                Resource: "*"
              # DynamoDB — write scoring metadata
              - Sid: DynamoDBWrite
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-scores-${Environment}"
              # KMS — decrypt S3 objects
              - Sid: KMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt ScorerKMSKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── IAM Role: Lambda — Inference Trigger ─────────────────────────────────────
  LambdaInferenceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-inference-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InferencePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SageMakerInvokeEndpoint
                Effect: Allow
                Action:
                  - sagemaker:InvokeEndpoint
                Resource: !Sub "arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/${ProjectName}-scoring-endpoint-${Environment}"
              - Sid: DynamoDBReadWrite
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-scores-${Environment}"
              - Sid: KMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt ScorerKMSKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── IAM Role: SageMaker Training & Hosting ───────────────────────────────────
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-sagemaker-execution-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: SageMakerS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3ArtifactsReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt MLArtifactsBucket.Arn
                  - !Sub "${MLArtifactsBucket.Arn}/*"
              - Sid: KMSAccess
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt ScorerKMSKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── IAM Role: Step Functions State Machine ───────────────────────────────────
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-stepfunctions-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsOrchestrationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeLambdas
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*"
              - Sid: SageMakerTraining
                Effect: Allow
                Action:
                  - sagemaker:CreateTrainingJob
                  - sagemaker:DescribeTrainingJob
                  - sagemaker:StopTrainingJob
                  - sagemaker:CreateModel
                  - sagemaker:CreateEndpointConfig
                  - sagemaker:CreateEndpoint
                  - sagemaker:UpdateEndpoint
                  - sagemaker:DescribeEndpoint
                Resource: "*"
              - Sid: LogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
              - Sid: PassRoleToSageMaker
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SageMakerExecutionRole.Arn
                Condition:
                  StringEquals:
                    "iam:PassedToService": sagemaker.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── SSM Parameter Store — store resource names for cross-stack reference ─────
  SSMCreativeAssetsBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/s3/creative-assets-bucket"
      Type: String
      Value: !Ref CreativeAssetsBucket
      Description: S3 bucket name for creative asset ingestion

  SSMMLArtifactsBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/s3/ml-artifacts-bucket"
      Type: String
      Value: !Ref MLArtifactsBucket
      Description: S3 bucket name for ML training data and model artifacts

  SSMKMSKeyArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/kms/key-arn"
      Type: String
      Value: !GetAtt ScorerKMSKey.Arn
      Description: KMS key ARN for encryption at rest

# ─── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  CreativeAssetsBucketName:
    Description: S3 bucket for raw creative ingestion
    Value: !Ref CreativeAssetsBucket
    Export:
      Name: !Sub "${ProjectName}-${Environment}-CreativeAssetsBucket"

  MLArtifactsBucketName:
    Description: S3 bucket for ML artifacts
    Value: !Ref MLArtifactsBucket
    Export:
      Name: !Sub "${ProjectName}-${Environment}-MLArtifactsBucket"

  KMSKeyArn:
    Description: KMS key ARN
    Value: !GetAtt ScorerKMSKey.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-KMSKeyArn"

  LambdaFeatureExtractionRoleArn:
    Description: IAM Role ARN for Feature Extraction Lambda
    Value: !GetAtt LambdaFeatureExtractionRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-LambdaFeatureExtractionRoleArn"

  LambdaInferenceRoleArn:
    Description: IAM Role ARN for Inference Lambda
    Value: !GetAtt LambdaInferenceRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-LambdaInferenceRoleArn"

  SageMakerExecutionRoleArn:
    Description: IAM Role ARN for SageMaker
    Value: !GetAtt SageMakerExecutionRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-SageMakerRoleArn"

  StepFunctionsRoleArn:
    Description: IAM Role ARN for Step Functions
    Value: !GetAtt StepFunctionsRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-StepFunctionsRoleArn"
