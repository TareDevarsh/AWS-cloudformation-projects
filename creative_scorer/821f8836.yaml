# =============================================================================
# TEMPLATE 2: Compute & Storage Layer — DynamoDB, Lambda Functions
# Stack Name: ad-scorer-compute
# Deploy SECOND — depends on Foundation stack exports.
# =============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Compute and storage stack for the Ad Creative Scorer.
  Provisions DynamoDB table and Lambda functions for feature extraction and inference.

# ─── Parameters ───────────────────────────────────────────────────────────────
Parameters:
  ProjectName:
    Type: String
    Default: ad-scorer

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  LambdaRuntimeVersion:
    Type: String
    Default: python3.12
    Description: Lambda Python runtime version

  LambdaMemoryFeatureExtraction:
    Type: Number
    Default: 1024
    Description: Memory (MB) for the Feature Extraction Lambda. Higher = faster Rekognition calls.

  LambdaTimeoutFeatureExtraction:
    Type: Number
    Default: 300
    Description: Timeout (seconds) for the Feature Extraction Lambda (max 15 min).

  LambdaMemoryInference:
    Type: Number
    Default: 512

  LambdaTimeoutInference:
    Type: Number
    Default: 60

  DynamoDBBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]
    Description: >
      PAY_PER_REQUEST for dev/variable workloads.
      PROVISIONED for predictable high-volume production traffic.

# ─── Resources ────────────────────────────────────────────────────────────────
Resources:

  # ── DynamoDB: Creative Scoring Results ───────────────────────────────────────
  # Schema:
  #   PK: creativeId (String) — unique hash of the asset (S3 ETag or custom UUID)
  #   SK: scoredAt  (String) — ISO-8601 timestamp for range queries
  #   Attributes: ctr_score, engagement_score, features (JSON map), status
  CreativeScoringTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-scores-${Environment}"
      BillingMode: !Ref DynamoDBBillingMode
      TableClass: STANDARD
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !ImportValue
          Fn::Sub: "${ProjectName}-${Environment}-KMSKeyArn"
      AttributeDefinitions:
        - AttributeName: creativeId
          AttributeType: S
        - AttributeName: scoredAt
          AttributeType: S
        - AttributeName: campaignId
          AttributeType: S
        - AttributeName: ctrScore
          AttributeType: N
      KeySchema:
        - AttributeName: creativeId
          KeyType: HASH
        - AttributeName: scoredAt
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI 1: Query all creatives by campaign, sorted by score
        - IndexName: CampaignScoreIndex
          KeySchema:
            - AttributeName: campaignId
              KeyType: HASH
            - AttributeName: ctrScore
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - creativeId
              - scoredAt
              - status
              - engagementScore
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ── CloudWatch Log Groups — explicit retention control ────────────────────────
  FeatureExtractionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-feature-extraction-${Environment}"
      RetentionInDays: 30
      KmsKeyId: !ImportValue
        Fn::Sub: "${ProjectName}-${Environment}-KMSKeyArn"

  InferenceLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-inference-${Environment}"
      RetentionInDays: 30
      KmsKeyId: !ImportValue
        Fn::Sub: "${ProjectName}-${Environment}-KMSKeyArn"

  # ── Lambda Function: Feature Extraction ──────────────────────────────────────
  # Triggered by Step Functions state machine (not directly by S3).
  # Calls Rekognition APIs and writes feature JSON to S3.
  FeatureExtractionFunction:
    Type: AWS::Lambda::Function
    DependsOn: FeatureExtractionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-feature-extraction-${Environment}"
      Description: >
        Ingests a creative asset from S3, calls Rekognition for
        object detection, face analysis, text detection, and emotion scoring.
        Returns structured feature JSON.
      Runtime: !Ref LambdaRuntimeVersion
      Handler: index.handler
      MemorySize: !Ref LambdaMemoryFeatureExtraction
      Timeout: !Ref LambdaTimeoutFeatureExtraction
      Role: !ImportValue
        Fn::Sub: "${ProjectName}-${Environment}-LambdaFeatureExtractionRoleArn"
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          ENVIRONMENT: !Ref Environment
          CREATIVE_BUCKET: !ImportValue
            Fn::Sub: "${ProjectName}-${Environment}-CreativeAssetsBucket"
          ML_ARTIFACTS_BUCKET: !ImportValue
            Fn::Sub: "${ProjectName}-${Environment}-MLArtifactsBucket"
          SCORES_TABLE: !Ref CreativeScoringTable
          # Rekognition — control which detections are enabled (cost control)
          REKOGNITION_FACE_ENABLED: "true"
          REKOGNITION_LABELS_MAX: "20"
          REKOGNITION_TEXT_ENABLED: "true"
          REKOGNITION_MODERATION_ENABLED: "true"
          LOG_LEVEL: INFO
      ReservedConcurrentExecutions: 50  # Prevent Rekognition quota exhaustion
      TracingConfig:
        Mode: Active  # AWS X-Ray tracing
      Code:
        ZipFile: |
          """
          Feature Extraction Lambda Handler
          -----------------------------------
          This is a STUB — replace with packaged deployment artefact.
          The real implementation should:
            1. Receive event: { s3_bucket, s3_key, creative_id, campaign_id }
            2. Call Rekognition: DetectLabels, DetectFaces, DetectText, DetectModerationLabels
            3. Derive features:
               - face_present (bool), face_count (int)
               - dominant_emotion (str), emotion_confidence (float)
               - text_density (float = detected_words / image_area_pixels)
               - color_saturation (computed via PIL on S3 object bytes)
               - object_labels (list of top-N labels with confidence)
               - moderation_flags (list)
            4. Write feature JSON to s3://ml-artifacts-bucket/features/{creative_id}.json
            5. Update DynamoDB item status: FEATURES_EXTRACTED
            6. Return feature dict to Step Functions
          """
          import json
          import os
          import boto3
          import logging

          logger = logging.getLogger()
          logger.setLevel(os.environ.get("LOG_LEVEL", "INFO"))

          rekognition = boto3.client("rekognition")
          s3 = boto3.client("s3")
          dynamodb = boto3.resource("dynamodb")

          def handler(event, context):
              logger.info("Feature extraction invoked", extra={"event": event})

              creative_id = event["creative_id"]
              s3_bucket   = event["s3_bucket"]
              s3_key      = event["s3_key"]

              # ── 1. Detect Labels ──────────────────────────────────────────────
              labels_response = rekognition.detect_labels(
                  Image={"S3Object": {"Bucket": s3_bucket, "Name": s3_key}},
                  MaxLabels=int(os.environ.get("REKOGNITION_LABELS_MAX", "20")),
                  MinConfidence=70.0
              )
              labels = [
                  {"name": l["Name"], "confidence": round(l["Confidence"], 2)}
                  for l in labels_response["Labels"]
              ]

              # ── 2. Detect Faces & Emotions ────────────────────────────────────
              faces_response = rekognition.detect_faces(
                  Image={"S3Object": {"Bucket": s3_bucket, "Name": s3_key}},
                  Attributes=["ALL"]
              )
              face_count        = len(faces_response["FaceDetails"])
              dominant_emotion  = None
              emotion_confidence = 0.0
              if face_count > 0:
                  top_emotion = max(
                      faces_response["FaceDetails"][0]["Emotions"],
                      key=lambda e: e["Confidence"]
                  )
                  dominant_emotion   = top_emotion["Type"]
                  emotion_confidence = round(top_emotion["Confidence"], 2)

              # ── 3. Detect Text ────────────────────────────────────────────────
              text_response = rekognition.detect_text(
                  Image={"S3Object": {"Bucket": s3_bucket, "Name": s3_key}}
              )
              word_count = sum(
                  1 for t in text_response["TextDetections"] if t["Type"] == "WORD"
              )

              # ── 4. Detect Moderation Labels ───────────────────────────────────
              mod_response = rekognition.detect_moderation_labels(
                  Image={"S3Object": {"Bucket": s3_bucket, "Name": s3_key}},
                  MinConfidence=60.0
              )
              moderation_flags = [m["Name"] for m in mod_response["ModerationLabels"]]

              # ── 5. Assemble Feature Dict ──────────────────────────────────────
              features = {
                  "creative_id":         creative_id,
                  "face_present":        face_count > 0,
                  "face_count":          face_count,
                  "dominant_emotion":    dominant_emotion,
                  "emotion_confidence":  emotion_confidence,
                  "word_count":          word_count,
                  "labels":              labels,
                  "moderation_flags":    moderation_flags,
                  # color_saturation: TODO — compute via PIL (packaged layer)
              }

              # ── 6. Write features to S3 ───────────────────────────────────────
              ml_bucket = os.environ["ML_ARTIFACTS_BUCKET"]
              feature_key = f"features/{creative_id}.json"
              s3.put_object(
                  Bucket=ml_bucket,
                  Key=feature_key,
                  Body=json.dumps(features),
                  ContentType="application/json"
              )

              # ── 7. Update DynamoDB status ─────────────────────────────────────
              table = dynamodb.Table(os.environ["SCORES_TABLE"])
              table.update_item(
                  Key={"creativeId": creative_id, "scoredAt": event["scored_at"]},
                  UpdateExpression="SET #status = :s, featureS3Key = :k",
                  ExpressionAttributeNames={"#status": "status"},
                  ExpressionAttributeValues={
                      ":s": "FEATURES_EXTRACTED",
                      ":k": feature_key
                  }
              )

              logger.info("Feature extraction complete", extra={"features": features})
              return features
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── Lambda Function: Inference Trigger ───────────────────────────────────────
  # Receives feature dict from Step Functions, calls SageMaker endpoint,
  # writes final CTR/engagement score to DynamoDB, and returns API response.
  InferenceFunction:
    Type: AWS::Lambda::Function
    DependsOn: InferenceLambdaLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-inference-${Environment}"
      Description: >
        Calls the SageMaker scoring endpoint with extracted features.
        Returns predicted CTR score and writes result to DynamoDB.
      Runtime: !Ref LambdaRuntimeVersion
      Handler: index.handler
      MemorySize: !Ref LambdaMemoryInference
      Timeout: !Ref LambdaTimeoutInference
      Role: !ImportValue
        Fn::Sub: "${ProjectName}-${Environment}-LambdaInferenceRoleArn"
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          ENVIRONMENT: !Ref Environment
          SCORES_TABLE: !Ref CreativeScoringTable
          # The endpoint name is set after SageMaker stack is deployed
          SAGEMAKER_ENDPOINT_NAME: !Sub "${ProjectName}-scoring-endpoint-${Environment}"
          LOG_LEVEL: INFO
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          """
          Inference Lambda Handler
          -------------------------
          Receives feature dict from Step Functions.
          Calls SageMaker real-time endpoint.
          Writes CTR score + engagement score to DynamoDB.
          Returns score payload to Step Functions / API response.
          """
          import json
          import os
          import boto3
          import logging
          from datetime import datetime, timezone
          from decimal import Decimal

          logger = logging.getLogger()
          logger.setLevel(os.environ.get("LOG_LEVEL", "INFO"))

          sagemaker_runtime = boto3.client("sagemaker-runtime")
          dynamodb           = boto3.resource("dynamodb")

          def handler(event, context):
              logger.info("Inference invoked", extra={"event": event})

              creative_id = event["creative_id"]
              features    = event["features"]

              # ── Build feature vector for XGBoost endpoint ─────────────────────
              # Feature order must match training-time column order.
              feature_vector = [
                  int(features.get("face_present", False)),
                  features.get("face_count", 0),
                  features.get("emotion_confidence", 0.0),
                  features.get("word_count", 0),
                  len(features.get("labels", [])),
                  len(features.get("moderation_flags", [])),
                  # color_saturation placeholder — replace with real value
                  features.get("color_saturation", 0.5),
              ]

              csv_payload = ",".join(str(v) for v in feature_vector)

              # ── Call SageMaker endpoint ────────────────────────────────────────
              endpoint_name = os.environ["SAGEMAKER_ENDPOINT_NAME"]
              response = sagemaker_runtime.invoke_endpoint(
                  EndpointName=endpoint_name,
                  ContentType="text/csv",
                  Accept="application/json",
                  Body=csv_payload
              )
              prediction_body = json.loads(response["Body"].read().decode("utf-8"))
              ctr_score        = round(float(prediction_body.get("predictions", [0.5])[0]), 4)
              engagement_score = round(ctr_score * 1.15, 4)  # simplified derived metric

              # ── Write to DynamoDB ─────────────────────────────────────────────
              table = dynamodb.Table(os.environ["SCORES_TABLE"])
              table.update_item(
                  Key={"creativeId": creative_id, "scoredAt": event["scored_at"]},
                  UpdateExpression=(
                      "SET ctrScore = :ctr, engagementScore = :eng, "
                      "#status = :s, scoredAtFinal = :ts"
                  ),
                  ExpressionAttributeNames={"#status": "status"},
                  ExpressionAttributeValues={
                      ":ctr": Decimal(str(ctr_score)),
                      ":eng": Decimal(str(engagement_score)),
                      ":s":   "SCORED",
                      ":ts":  datetime.now(timezone.utc).isoformat()
                  }
              )

              result = {
                  "creative_id":       creative_id,
                  "ctr_score":         ctr_score,
                  "engagement_score":  engagement_score,
                  "status":            "SCORED"
              }
              logger.info("Inference complete", extra={"result": result})
              return result
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── Lambda: Presigned URL Generator (for asset upload via API Gateway) ────────
  PresignedURLFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-presigned-url-${Environment}"
      Description: Generates S3 presigned PUT URLs for client-side creative uploads
      Runtime: !Ref LambdaRuntimeVersion
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !ImportValue
        Fn::Sub: "${ProjectName}-${Environment}-LambdaFeatureExtractionRoleArn"
      Environment:
        Variables:
          CREATIVE_BUCKET: !ImportValue
            Fn::Sub: "${ProjectName}-${Environment}-CreativeAssetsBucket"
          URL_EXPIRY_SECONDS: "3600"
      Code:
        ZipFile: |
          import json
          import os
          import uuid
          import boto3
          from datetime import datetime, timezone

          s3 = boto3.client("s3")

          ALLOWED_CONTENT_TYPES = {
              "image/jpeg", "image/png", "image/webp", "image/gif",
              "video/mp4", "video/quicktime"
          }

          def handler(event, context):
              body = json.loads(event.get("body") or "{}")
              content_type = body.get("content_type", "image/jpeg")
              campaign_id  = body.get("campaign_id", "unknown")

              if content_type not in ALLOWED_CONTENT_TYPES:
                  return {
                      "statusCode": 400,
                      "body": json.dumps({"error": "Unsupported content type"})
                  }

              creative_id = str(uuid.uuid4())
              s3_key = f"uploads/{campaign_id}/{creative_id}"

              presigned_url = s3.generate_presigned_url(
                  "put_object",
                  Params={
                      "Bucket":      os.environ["CREATIVE_BUCKET"],
                      "Key":         s3_key,
                      "ContentType": content_type,
                  },
                  ExpiresIn=int(os.environ.get("URL_EXPIRY_SECONDS", "3600"))
              )

              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({
                      "creative_id":   creative_id,
                      "upload_url":    presigned_url,
                      "s3_key":        s3_key,
                      "expires_in":    int(os.environ.get("URL_EXPIRY_SECONDS", "3600")),
                      "content_type":  content_type
                  })
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── Lambda: Step Functions Trigger (called by API Gateway POST /score) ────────
  PipelineTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-pipeline-trigger-${Environment}"
      Description: >
        Receives POST /score from API Gateway, starts Step Functions execution,
        returns execution ARN immediately (async scoring pattern).
      Runtime: !Ref LambdaRuntimeVersion
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Role: !ImportValue
        Fn::Sub: "${ProjectName}-${Environment}-LambdaFeatureExtractionRoleArn"
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          ENVIRONMENT: !Ref Environment
          SCORES_TABLE: !Ref CreativeScoringTable
          # STATE_MACHINE_ARN is injected via SSM once StepFunctions stack deploys
          STATE_MACHINE_ARN_PARAM: !Sub "/${ProjectName}/${Environment}/stepfunctions/state-machine-arn"
      Code:
        ZipFile: |
          import json
          import os
          import uuid
          import boto3
          from datetime import datetime, timezone

          sfn = boto3.client("stepfunctions")
          ssm = boto3.client("ssm")
          dynamodb = boto3.resource("dynamodb")

          def get_state_machine_arn():
              resp = ssm.get_parameter(Name=os.environ["STATE_MACHINE_ARN_PARAM"])
              return resp["Parameter"]["Value"]

          def handler(event, context):
              body = json.loads(event.get("body") or "{}")
              s3_bucket   = body.get("s3_bucket")
              s3_key      = body.get("s3_key")
              campaign_id = body.get("campaign_id", "default")
              creative_id = body.get("creative_id", str(uuid.uuid4()))
              scored_at   = datetime.now(timezone.utc).isoformat()

              if not s3_bucket or not s3_key:
                  return {
                      "statusCode": 400,
                      "body": json.dumps({"error": "s3_bucket and s3_key are required"})
                  }

              # ── Seed DynamoDB item with PENDING status ─────────────────────────
              table = dynamodb.Table(os.environ["SCORES_TABLE"])
              table.put_item(Item={
                  "creativeId":  creative_id,
                  "scoredAt":    scored_at,
                  "campaignId":  campaign_id,
                  "s3Key":       s3_key,
                  "status":      "PENDING",
              })

              # ── Start Step Functions execution ────────────────────────────────
              state_machine_arn = get_state_machine_arn()
              execution = sfn.start_execution(
                  stateMachineArn=state_machine_arn,
                  name=f"{creative_id[:8]}-{int(datetime.now().timestamp())}",
                  input=json.dumps({
                      "creative_id": creative_id,
                      "campaign_id": campaign_id,
                      "s3_bucket":   s3_bucket,
                      "s3_key":      s3_key,
                      "scored_at":   scored_at
                  })
              )

              return {
                  "statusCode": 202,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({
                      "creative_id":    creative_id,
                      "status":         "PENDING",
                      "execution_arn":  execution["executionArn"],
                      "scored_at":      scored_at
                  })
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName

# ─── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  CreativeScoringTableName:
    Description: DynamoDB table name for scoring results
    Value: !Ref CreativeScoringTable
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ScoringTableName"

  CreativeScoringTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt CreativeScoringTable.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ScoringTableArn"

  FeatureExtractionFunctionArn:
    Description: Feature Extraction Lambda ARN
    Value: !GetAtt FeatureExtractionFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-FeatureExtractionLambdaArn"

  InferenceFunctionArn:
    Description: Inference Lambda ARN
    Value: !GetAtt InferenceFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-InferenceLambdaArn"

  PresignedURLFunctionArn:
    Description: Presigned URL Generator Lambda ARN
    Value: !GetAtt PresignedURLFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PresignedURLLambdaArn"

  PipelineTriggerFunctionArn:
    Description: Pipeline Trigger Lambda ARN
    Value: !GetAtt PipelineTriggerFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-PipelineTriggerLambdaArn"
