# nginx router: the only thing reachable from outside the EC2.
# Routes by URL prefix:  /python/... -> limiter-python
#                        /go/...     -> limiter-go
#                        /node/...   -> limiter-node
# The path is passed through unchanged; each limiter strips its own prefix.

# One worker process per CPU core.
worker_processes auto;

# Where nginx writes its process id (inside the container).
pid /tmp/nginx.pid;

events {
    # Max simultaneous connections per worker.
    worker_connections 1024;
}

http {
    # Don't reveal the nginx version in headers or error pages.
    server_tokens off;

    # One JSON log line per request, to stdout (docker logs).
    #   request_time            total time nginx spent on the request (s)
    #   upstream_response_time  time the limiter took (s)
    #   router hop = request_time - upstream_response_time
    log_format timing escape=json
        '{"t":"$time_iso8601","path":"$uri","status":$status,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"upstream":"$upstream_addr"}';
    access_log /dev/stdout timing;
    # Errors to stderr (docker logs).
    error_log /dev/stderr warn;

    # Keep a pool of open connections to each limiter, so every request
    # doesn't pay for a new TCP connection (lower latency).
    upstream limiter_python { server limiter-python:8000; keepalive 32; }
    upstream limiter_go     { server limiter-go:8000;     keepalive 32; }
    upstream limiter_node   { server limiter-node:8000;   keepalive 32; }

    server {
        # The single published port (see docker-compose.yml).
        listen 8080;

        # Settings shared by every route below.
        # HTTP/1.1 + empty Connection header = reuse the keepalive pool.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The real client IP, from the TCP connection. This REPLACES any
        # X-Real-IP the client sent, so callers can't fake their IP bucket.
        proxy_set_header X-Real-IP $remote_addr;
        # Original Host header.
        proxy_set_header Host $host;
        # Fail fast if a limiter is down.
        proxy_connect_timeout 2s;
        # Backend Lambda calls can take a while (cold start).
        proxy_read_timeout 30s;

        # Python limiter.
        location /python/ { proxy_pass http://limiter_python; }
        # Go limiter.
        location /go/     { proxy_pass http://limiter_go; }
        # Node limiter.
        location /node/   { proxy_pass http://limiter_node; }

        # nginx's own health check (doesn't touch the limiters).
        location = /healthz {
            default_type application/json;
            return 200 '{"ok":true}';
        }

        # Anything else: not found.
        location / {
            default_type application/json;
            return 404 '{"error":"use /python/, /go/ or /node/"}';
        }
    }
}
