AWSTemplateFormatVersion: "2010-09-09"
Description: >
  04-consistent-hashing - Hash ring with virtual nodes plus a quorum key-value store.
  API Gateway (REST, IAM auth) -> ring Lambda + kv coordinator Lambda (Python)
  -> DynamoDB ring table + data table (on-demand). N replicas, W/R quorum,
  vector-clock versioning, sloppy quorum + hinted handoff for temporary failures.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment stage, used in names and tags.
  N:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: Replicas per key (first N distinct servers clockwise).
  W:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Default write quorum (acks needed). Keep W <= N.
  R:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Default read quorum (responses needed). Keep R <= N.
  MaxClockEntries:
    Type: Number
    Default: 10
    MinValue: 2
    MaxValue: 100
    Description: >
      Vector-clock threshold. When a clock exceeds this many server entries, the oldest
      (by updatedAt) are dropped, which can cause inaccurate reconciliation (false conflicts).
  HintScanLimit:
    Type: Number
    Default: 500
    MinValue: 1
    MaxValue: 5000
    Description: Max stand-in items scanned per hinted-handoff replay call (bounds the work).
  HintReplayLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
    Description: Max hints handed off per replay call (bounds the work; `more` flags a remainder).
  MerkleBuckets:
    Type: Number
    Default: 16
    AllowedValues: [2, 4, 8, 16, 32, 64, 128, 256]
    Description: >
      Leaf buckets per Merkle tree for anti-entropy repair. A power of two, so the tree above the
      buckets is a clean binary tree. A key is placed in bucket SHA-1(key) mod MerkleBuckets.
  RepairScheduleRate:
    Type: String
    Default: rate(1 hour)
    AllowedPattern: "^(rate\\(.+\\)|cron\\(.+\\))$"
    Description: EventBridge schedule expression for the background anti-entropy repair pass.
  RepairScheduleEnabled:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Whether the scheduled background repair rule is enabled.

Conditions:
  RepairScheduleOn: !Equals [!Ref RepairScheduleEnabled, ENABLED]

Resources:
  # ---------- Data ----------
  # One partition per ring (pk = RING#default). Sort keys:
  #   SERVER#<serverId>      -> serverId, vnodeCount, status (up | down, simulated failure)
  #   VNODE#<40-hex SHA-1>   -> serverId, vnodeIndex (sorted by position, so a Query returns the ring in order)
  RingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete            # prototype; switch to Retain for real data
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  # One item per replica: serverId (partition) + itemKey (sort) -> rev, versions (JSON list of
  # sibling {value, clock, timestamp}). rev backs an optimistic-concurrency conditional write so
  # concurrent writers to the same replica item do not clobber each other.
  # A partition per simulated server mirrors one node's local storage.
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete            # prototype; switch to Retain for real data
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serverId
          AttributeType: S
        - AttributeName: itemKey
          AttributeType: S
      KeySchema:
        - AttributeName: serverId
          KeyType: HASH
        - AttributeName: itemKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  # ---------- Compute ----------
  RingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/consistent-hashing-ring-${Stage}
      RetentionInDays: 14
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  RingFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ring-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt RingTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RingFunctionLogGroup.Arn
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  RingFunction:
    Type: AWS::Lambda::Function
    DependsOn: RingFunctionLogGroup
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3002]   # local Code path is resolved by `aws cloudformation package`
    Properties:
      FunctionName: !Sub consistent-hashing-ring-${Stage}
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt RingFunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref RingTable
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }
      # Local path; `aws cloudformation package` zips it and uploads to S3.
      # deploy.sh packages a staged copy with src/shared/ring_math.py added.
      Code: ../src/ring/

  KvFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/consistent-hashing-kv-${Stage}
      RetentionInDays: 14
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  KvFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kv-coordinator-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow           # read the ring and server status; mark a server up on /up
                Action:
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt RingTable.Arn
              - Effect: Allow           # replica reads/writes; Scan finds hint items; Query lists a server's items for repair
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource: !GetAtt DataTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt KvFunctionLogGroup.Arn
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  KvFunction:
    Type: AWS::Lambda::Function
    DependsOn: KvFunctionLogGroup
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3002]   # local Code path is resolved by `aws cloudformation package`
    Properties:
      FunctionName: !Sub consistent-hashing-kv-${Stage}
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt KvFunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          RING_TABLE_NAME: !Ref RingTable
          DATA_TABLE_NAME: !Ref DataTable
          QUORUM_N: !Ref N
          QUORUM_W: !Ref W
          QUORUM_R: !Ref R
          MAX_CLOCK_ENTRIES: !Ref MaxClockEntries
          HINT_SCAN_LIMIT: !Ref HintScanLimit
          HINT_REPLAY_LIMIT: !Ref HintReplayLimit
          MERKLE_BUCKETS: !Ref MerkleBuckets
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }
      # deploy.sh packages a staged copy with src/shared/ring_math.py added.
      Code: ../src/kv/
  # ---------- API ----------
  RingApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub consistent-hashing-${Stage}
      Description: Consistent hashing ring + quorum KV API (IAM/SigV4 auth)
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  ServersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !GetAtt RingApi.RootResourceId
      PathPart: servers

  ServerIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !Ref ServersResource
      PathPart: "{serverId}"

  ServerDownResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !Ref ServerIdResource
      PathPart: down

  ServerUpResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !Ref ServerIdResource
      PathPart: up

  KvResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !GetAtt RingApi.RootResourceId
      PathPart: kv

  KvKeyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !Ref KvResource
      PathPart: "{key}"

  HintsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !GetAtt RingApi.RootResourceId
      PathPart: hints

  HintsReplayResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !Ref HintsResource
      PathPart: replay

  RepairResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !GetAtt RingApi.RootResourceId
      PathPart: repair

  MerkleResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !GetAtt RingApi.RootResourceId
      PathPart: merkle

  MerkleServerIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !Ref MerkleResource
      PathPart: "{serverId}"

  RouteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !GetAtt RingApi.RootResourceId
      PathPart: route

  RouteKeyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RingApi
      ParentId: !Ref RouteResource
      PathPart: "{key}"

  AddServerMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref ServersResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RingFunction.Arn}/invocations

  ListServersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref ServersResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RingFunction.Arn}/invocations

  RemoveServerMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref ServerIdResource
      HttpMethod: DELETE
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RingFunction.Arn}/invocations

  RouteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref RouteKeyResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RingFunction.Arn}/invocations

  ServerDownMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref ServerDownResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RingFunction.Arn}/invocations

  # /up is served by the kv Lambda: marking a server up also replays hinted-handoff writes to it.
  ServerUpMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref ServerUpResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  PutKeyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref KvKeyResource
      HttpMethod: PUT
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  GetKeyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref KvKeyResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  HintsReplayMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref HintsReplayResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  RepairMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref RepairResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  MerkleMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RingApi
      ResourceId: !Ref MerkleServerIdResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  # A new logical ID each time methods change makes CloudFormation create a fresh deployment so the
  # new routes go live on stacks that already ran an earlier step. V3 added /hints/replay and
  # repointed /servers/{id}/up to the kv Lambda. V4 adds /repair and /merkle/{serverId}
  # (Merkle-tree anti-entropy repair, step 5).
  RingApiDeploymentV4:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [AddServerMethod, ListServersMethod, RemoveServerMethod, RouteMethod,
                ServerDownMethod, ServerUpMethod, PutKeyMethod, GetKeyMethod, HintsReplayMethod,
                RepairMethod, MerkleMethod]
    Properties:
      RestApiId: !Ref RingApi

  RingApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RingApi
      DeploymentId: !Ref RingApiDeploymentV4
      StageName: !Ref Stage
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  RingFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RingFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RingApi}/*/*/*

  KvFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref KvFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RingApi}/*/*/*

  # ---------- Scheduled anti-entropy repair (step 5, Option B) ----------
  # EventBridge invokes the kv Lambda directly on a schedule with a constant {"source":"scheduled-repair"}
  # event, so the handler runs scheduled_repair() (repair each adjacent replica pair on the ring).
  # No extra IAM is needed on the kv role: the scheduled path reuses the existing ring-read + data
  # read/write permissions. Only EventBridge gets permission to invoke the function.
  RepairScheduleRule:
    Type: AWS::Events::Rule
    Condition: RepairScheduleOn
    Properties:
      Name: !Sub consistent-hashing-repair-${Stage}
      Description: Background Merkle-tree anti-entropy repair of adjacent replica pairs.
      ScheduleExpression: !Ref RepairScheduleRate
      State: ENABLED
      Targets:
        - Id: kv-scheduled-repair
          Arn: !GetAtt KvFunction.Arn
          Input: '{"source": "scheduled-repair"}'
      Tags:
        - { Key: Project, Value: 04-consistent-hashing }
        - { Key: Stage, Value: !Ref Stage }

  RepairSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: RepairScheduleOn
    Properties:
      FunctionName: !Ref KvFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RepairScheduleRule.Arn

  # ---------- Client access ----------
  RingClientPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach to a user/role that should call the consistent hashing API.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: execute-api:Invoke
            Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RingApi}/${Stage}/*/*

Outputs:
  ApiEndpoint:
    Description: Base URL for the ring API
    Value: !Sub https://${RingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  TableName:
    Description: DynamoDB table holding servers and virtual nodes
    Value: !Ref RingTable
  FunctionName:
    Description: ring Lambda (servers, routing, up/down)
    Value: !Ref RingFunction
  DataTableName:
    Description: DynamoDB table holding one item per key replica
    Value: !Ref DataTable
  KvFunctionName:
    Description: kv coordinator Lambda (quorum PUT/GET)
    Value: !Ref KvFunction
  ClientPolicyArn:
    Description: Attach this managed policy to callers to grant execute-api:Invoke
    Value: !Ref RingClientPolicy
