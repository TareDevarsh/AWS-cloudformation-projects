# =============================================================================
# TEMPLATE 5: ML Platform — SageMaker Model + real-time Endpoint
# Stack Name: ad-scorer-<env>-ml
# Deploy FIFTH, after training: CloudFormation has no training-job resource,
# so run scripts/train.sh first and pass the model key it prints as ModelS3Key.
# =============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SageMaker resources for the Ad Creative Scorer: Model, Endpoint Config,
  real-time Endpoint and auto scaling. Uses the built-in XGBoost container
  for CTR prediction. The model is trained by scripts/train.sh.

Parameters:
  ProjectName:
    Type: String
    Default: ad-scorer

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  SageMakerXGBoostVersion:
    Type: String
    Default: "1.7-1"
    Description: XGBoost container image version tag (must match scripts/train.sh)

  InferenceInstanceType:
    Type: String
    Default: ml.t2.medium
    Description: Instance type for the real-time inference endpoint
    AllowedValues:
      - ml.t2.medium
      - ml.t2.large
      - ml.m5.large
      - ml.m5.xlarge
      - ml.c5.large

  ModelS3Key:
    Type: String
    Description: >
      S3 key of the trained model artifact in the ML Artifacts bucket, as
      printed by scripts/train.sh
      (models/xgboost-ctr/<training-job-name>/output/model.tar.gz).
    AllowedPattern: "^models/.+\\.tar\\.gz$"

Resources:

  # ── SageMaker Model ────────────────────────────────────────────────────────
  # No ModelName: CloudFormation generates one, so a new ModelS3Key can
  # replace the model (custom-named resources cannot be replaced).
  # The built-in XGBoost container needs no SAGEMAKER_PROGRAM entry point.
  AdScorerModel:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "${ProjectName}-${Environment}-SageMakerRoleArn"
      PrimaryContainer:
        Image: !Sub
          - "${Repo}:${SageMakerXGBoostVersion}"
          - Repo: !ImportValue
              Fn::Sub: "${ProjectName}-${Environment}-XGBoostImageRepo"
        ModelDataUrl: !Sub
          - "s3://${Bucket}/${ModelS3Key}"
          - Bucket: !ImportValue
              Fn::Sub: "${ProjectName}-${Environment}-MLArtifactsBucket"
      EnableNetworkIsolation: true  # Isolate inference container
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ── SageMaker Endpoint Configuration ───────────────────────────────────────
  # No EndpointConfigName, for the same replacement reason as the model.
  AdScorerEndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      KmsKeyId: !ImportValue
        Fn::Sub: "${ProjectName}-${Environment}-KMSKeyArn"
      ProductionVariants:
        - VariantName: Primary
          ModelName: !GetAtt AdScorerModel.ModelName
          InstanceType: !Ref InferenceInstanceType
          InitialInstanceCount: 1
          InitialVariantWeight: 1.0
      DataCaptureConfig:
        EnableCapture: true
        InitialSamplingPercentage: 20   # Capture 20% of requests for monitoring
        DestinationS3Uri: !Sub
          - "s3://${Bucket}/data-capture/"
          - Bucket: !ImportValue
              Fn::Sub: "${ProjectName}-${Environment}-MLArtifactsBucket"
        KmsKeyId: !ImportValue
          Fn::Sub: "${ProjectName}-${Environment}-KMSKeyArn"
        CaptureOptions:
          - CaptureMode: Input
          - CaptureMode: Output
        CaptureContentTypeHeader:
          CsvContentTypes:
            - text/csv
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ── SageMaker Real-Time Endpoint ────────────────────────────────────────────
  # Fixed name: the inference Lambda, its IAM role and the 06 alarms use it.
  AdScorerEndpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: !Sub "${ProjectName}-scoring-endpoint-${Environment}"
      EndpointConfigName: !GetAtt AdScorerEndpointConfig.EndpointConfigName
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ── Application Auto Scaling for Endpoint ──────────────────────────────────
  # Scale between 1 and 10 instances based on InvocationsPerInstance.
  # RoleARN omitted: Application Auto Scaling creates its service-linked role.
  EndpointScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: AdScorerEndpoint
    Properties:
      MinCapacity: 1
      MaxCapacity: 10
      ResourceId: !Sub "endpoint/${ProjectName}-scoring-endpoint-${Environment}/variant/Primary"
      ScalableDimension: sagemaker:variant:DesiredInstanceCount
      ServiceNamespace: sagemaker

  EndpointScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-endpoint-scaling-${Environment}"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref EndpointScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: SageMakerVariantInvocationsPerInstance
        TargetValue: 70.0      # Scale out when >70 invocations/instance/minute
        ScaleInCooldown: 300   # 5 min cool-down before scaling in
        ScaleOutCooldown: 60   # 1 min cool-down before scaling out

  # ── SSM Parameter: endpoint name for other tools ───────────────────────────
  SSMEndpointName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/${Environment}/sagemaker/endpoint-name"
      Type: String
      Value: !Sub "${ProjectName}-scoring-endpoint-${Environment}"
      Description: SageMaker scoring endpoint name
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

Outputs:
  ModelName:
    Description: SageMaker model name (generated)
    Value: !GetAtt AdScorerModel.ModelName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ModelName"

  EndpointName:
    Description: SageMaker real-time endpoint name
    Value: !Sub "${ProjectName}-scoring-endpoint-${Environment}"
    Export:
      Name: !Sub "${ProjectName}-${Environment}-EndpointName"

  EndpointArn:
    Description: SageMaker endpoint ARN
    Value: !Ref AdScorerEndpoint
