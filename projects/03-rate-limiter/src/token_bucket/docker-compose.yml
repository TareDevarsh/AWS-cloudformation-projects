# Token bucket stack: nginx router + one limiter per language + Redis.
#
# Run from src/token_bucket/:
#   docker compose up -d --build
#
# Needs a .env file next to this one (never committed; deploy creates it):
#   REDIS_PASSWORD=<random hex>         required
#   RULES_BUCKET=<s3 bucket>            optional; empty = use baked-in rules.yaml
#   RULES_KEY=<s3 key>                  key of rules.yaml in that bucket
#   BACKEND_FUNCTION=<lambda name>      optional; empty = echo backend
#   AWS_REGION=<region>                 needed when either of the above is set
#
# Only the router publishes a port. Everything else talks over the private
# "internal" Docker network and is unreachable from outside the EC2.

services:
  # --- Router: the only public entry point ----------------------------------
  router:
    # Official nginx, stable branch, small Alpine base.
    image: nginx:1.30.6-alpine
    # Our routing config, read-only.
    volumes:
      - ./router/nginx.conf:/etc/nginx/nginx.conf:ro
    # Port 8080 on the EC2 -> 8080 in the container. This is the ONE published
    # port. It binds all interfaces on purpose: the EC2 security group is the
    # gate and allows only the owner's IP (added by hand after deploy).
    ports:
      - "8080:8080"
    # Start after the limiters exist.
    depends_on: [limiter-python, limiter-go, limiter-node]
    networks: [internal]
    restart: unless-stopped

  # --- Limiters: same algorithm, three languages ----------------------------
  limiter-python:
    # Built from python/Dockerfile with src/token_bucket/ as context.
    build: { context: ., dockerfile: python/Dockerfile }
    environment:
      # Password from .env; compose refuses to start if it's missing.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      PATH_PREFIX: /python
      RULES_BUCKET: ${RULES_BUCKET:-}
      RULES_KEY: ${RULES_KEY:-rules.yaml}
      BACKEND_FUNCTION: ${BACKEND_FUNCTION:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-}
    # No "ports:" = not reachable from outside the EC2.
    depends_on: { redis: { condition: service_healthy } }
    networks: [internal]
    restart: unless-stopped

  limiter-go:
    build: { context: ., dockerfile: go/Dockerfile }
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      PATH_PREFIX: /go
      RULES_BUCKET: ${RULES_BUCKET:-}
      RULES_KEY: ${RULES_KEY:-rules.yaml}
      BACKEND_FUNCTION: ${BACKEND_FUNCTION:-}
      AWS_REGION: ${AWS_REGION:-}
    depends_on: { redis: { condition: service_healthy } }
    networks: [internal]
    restart: unless-stopped

  limiter-node:
    build: { context: ., dockerfile: node/Dockerfile }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      PATH_PREFIX: /node
      RULES_BUCKET: ${RULES_BUCKET:-}
      RULES_KEY: ${RULES_KEY:-rules.yaml}
      BACKEND_FUNCTION: ${BACKEND_FUNCTION:-}
      AWS_REGION: ${AWS_REGION:-}
    depends_on: { redis: { condition: service_healthy } }
    networks: [internal]
    restart: unless-stopped

  # --- Redis: token buckets only --------------------------------------------
  redis:
    image: redis:8.10.3-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # --requirepass   password required for every client
    # --save ""       no snapshots to disk: buckets are short-lived anyway
    # --appendonly no no write log either
    # --maxmemory     cap memory on the small EC2
    # --maxmemory-policy volatile-ttl  if full, evict buckets closest to expiry
    #   (an evicted bucket just starts full again)
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-ttl
    # Healthy = answers PING with the password. Limiters wait for this.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" = never reachable from outside the EC2.
    networks: [internal]
    restart: unless-stopped

networks:
  # Private network shared by all services; Docker's DNS resolves service names.
  internal: {}
