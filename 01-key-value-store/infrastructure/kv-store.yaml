AWSTemplateFormatVersion: "2010-09-09"
Description: >
  01-key-value-store - Serverless key-value store.
  API Gateway (REST, IAM auth) -> Lambda (Python) -> DynamoDB (on-demand).

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment stage, used in names and tags.

Resources:
  # ---------- Data ----------
  KvTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete            # prototype; switch to Retain for real data
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: Project, Value: 01-key-value-store }
        - { Key: Stage, Value: !Ref Stage }

  # ---------- Compute ----------
  KvFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/kv-store-${Stage}
      RetentionInDays: 14

  KvFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kv-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt KvTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt KvFunctionLogGroup.Arn
      Tags:
        - { Key: Project, Value: 01-key-value-store }
        - { Key: Stage, Value: !Ref Stage }

  KvFunction:
    Type: AWS::Lambda::Function
    DependsOn: KvFunctionLogGroup
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3002]   # local Code path is resolved by `aws cloudformation package`
    Properties:
      FunctionName: !Sub kv-store-${Stage}
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt KvFunctionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref KvTable
      Tags:
        - { Key: Project, Value: 01-key-value-store }
        - { Key: Stage, Value: !Ref Stage }
      # Local path; `aws cloudformation package` zips it and uploads to S3.
      Code: ../src/

  # ---------- API ----------
  KvApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub kv-store-${Stage}
      Description: Key-value store API (IAM/SigV4 auth)
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - { Key: Project, Value: 01-key-value-store }
        - { Key: Stage, Value: !Ref Stage }

  KvResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KvApi
      ParentId: !GetAtt KvApi.RootResourceId
      PathPart: kv

  KvKeyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KvApi
      ParentId: !Ref KvResource
      PathPart: "{key}"

  ListKeysMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KvApi
      ResourceId: !Ref KvResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  GetKeyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KvApi
      ResourceId: !Ref KvKeyResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  PutKeyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KvApi
      ResourceId: !Ref KvKeyResource
      HttpMethod: PUT
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  DeleteKeyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KvApi
      ResourceId: !Ref KvKeyResource
      HttpMethod: DELETE
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KvFunction.Arn}/invocations

  KvApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [ListKeysMethod, GetKeyMethod, PutKeyMethod, DeleteKeyMethod]
    Properties:
      RestApiId: !Ref KvApi

  KvApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref KvApi
      DeploymentId: !Ref KvApiDeployment
      StageName: !Ref Stage
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
      Tags:
        - { Key: Project, Value: 01-key-value-store }
        - { Key: Stage, Value: !Ref Stage }

  KvFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref KvFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${KvApi}/*/*/kv*

  # ---------- Client access ----------
  KvClientPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach to a user/role that should call the KV API.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: execute-api:Invoke
            Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${KvApi}/${Stage}/*/kv*

Outputs:
  ApiEndpoint:
    Description: Base URL for the KV API
    Value: !Sub https://${KvApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  TableName:
    Description: DynamoDB table backing the store
    Value: !Ref KvTable
  FunctionName:
    Value: !Ref KvFunction
  ClientPolicyArn:
    Description: Attach this managed policy to callers to grant execute-api:Invoke
    Value: !Ref KvClientPolicy
